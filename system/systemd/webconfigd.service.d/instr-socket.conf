# SB-4 / T-P04: webconfigd (the local Configuration UI peer, §3.3) joins the
# shared `instr` group so the istate-created, instr-configuration:instr-owned
# 0660 configuration socket is connectable. The socket's ownership contract
# lives in istate's hubs.cpp own_socket(); group membership here is the
# webconfig side of the same contract.
#
# Shipped as a drop-in so webconfigd starts unchanged on machines without
# Instrumentation (cm5): the drop-in only exists when this package does.
[Service]
SupplementaryGroups=instr
