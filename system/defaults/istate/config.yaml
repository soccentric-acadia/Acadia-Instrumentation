# istate configuration (defaults; origin: default)
enabled: true
time_source_priority: [gnss, ptp, ntp]
ntp_servers: [pool.ntp.org]
ptp_domain: 0
gnss_constellations: [gps, galileo, glonass, beidou]
hq_endpoint: hq.acadia.example:51820
heartbeat_interval_s: 5
heartbeat_warning_timeout_s: 15
heartbeat_failure_timeout_s: 30
watchdog_timeout_s: 60
