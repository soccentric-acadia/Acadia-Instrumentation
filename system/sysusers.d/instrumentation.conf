# One system user per daemon (REQ §13, §10: each daemon unprivileged).
#
# The shared 'instr' group owns the socket directory and the registration
# sockets; the per-daemon user is the socket's owner, so a spoke can reach
# its own hub socket and no other. Configuration (the local Rust UI, §3.3)
# is a peer of the same shape and gets its own user for the same reason.
g instr - -
u instr-istate - 'Arches istate daemon' instr /var/empty
u instr-networkd - 'Arches networkd daemon' instr /var/empty
u instr-monitord - 'Arches monitord daemon' instr /var/empty
u instr-hardware - 'Arches hardware daemon' instr /var/empty
u instr-faults - 'Arches faults daemon' instr /var/empty
u instr-alarms - 'Arches alarms daemon' instr /var/empty
u instr-logmanager - 'Arches logmanager daemon' instr /var/empty
u instr-telemetry - 'Arches telemetry daemon' instr /var/empty
u instr-ota - 'Arches ota daemon' instr /var/empty
u instr-backup - 'Arches backup daemon' instr /var/empty
u instr-configuration - 'Arches Configuration UI peer' instr /var/empty
u instr-watchdog - 'Arches istate software watchdog' instr /var/empty

# Colocated applications (§7.6 R5, §7.8, §6.2). An application is not a
# daemon and gets no user of its own here — it joins this group, which is
# what the ApplicationApi socket and the application log sink are grouped
# to. Membership is the whole access decision: no group, no app surface.
g instr-apps - -

# T-P07 (INS-018, M03): platform device group for the gpiod character
# devices. RPi BSP's 99-com.rules (udev-rules-rpi) assigns
# SUBSYSTEM=="gpio" (incl. /dev/gpiochip*) to group gpio 0660; without this
# group instr-hardware's SupplementaryGroups=gpio is a start failure. The
# other supplementary groups the unit declares (input, dialout) come from
# base-passwd. INS unit control stays DRY-RUN per T-P00a (no polkit rule for
# Instrumentation — CFG owns operator-facing apply, the OS owns defaults).
