board: rpi-4b
devices:
  - name: status-led
    kind: led
    capability: led
    controls: [led_set, led_blink]
    checks:
      - name: blink-ack
        op: led_blink_ack
  - name: gpio-user
    kind: gpio
    capability: gpio
    params:
      line: 17
    controls: [gpio_set]
    checks:
      - name: toggle
        op: gpio_toggle_read
  - name: display
    kind: display
    capability: display
    controls: [display_control]
    checks:
      - name: probe
        op: display_probe
